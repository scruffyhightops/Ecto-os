<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090806">
<title>ECTO OS // Foundation Build 002</title>
<style>
:root{--bg:#090806;--panel:#141006;--panel2:#21170a;--line:#73531f;--fg:#ffbd36;--fg2:#ffe08a;--muted:#a48243;--ok:#62df70;--danger:#ff5540;--info:#54a9ff;--cyan:#52dbe7;--purple:#c88cff;--accent:#ffbd36;font-family:"Courier New",Courier,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:inherit}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px);z-index:10}button,input{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 18px;background:var(--panel)}.brand{font-size:26px;letter-spacing:.08em}.topstatus{font-size:11px;color:var(--ok);text-align:right}.layout{display:flex;flex:1;min-height:0}.nav{width:215px;flex:0 0 215px;border-right:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:7px}.nav button{width:100%;min-height:49px;border:1px solid var(--line);background:#0e0b07;color:var(--fg);text-align:left;padding:9px 11px;cursor:pointer}.nav button.active{background:var(--panel2);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.navTitle{font-size:10px;color:var(--muted);padding:3px 4px 5px;letter-spacing:.1em}.content{flex:1;min-width:0;padding:16px;overflow:auto}.screen{max-width:1200px;margin:auto}h1{font-size:21px;margin:0 0 14px;letter-spacing:.07em}h2{font-size:13px;margin:0 0 11px;color:var(--fg2)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid var(--line);background:rgba(20,15,8,.9);padding:14px}.muted{color:var(--muted);font-size:11px}.ok{color:var(--ok)}.danger{color:var(--danger)}.blue{color:var(--info)}.btn{border:1px solid var(--line);background:linear-gradient(#21170a,#0e0b07);color:var(--fg);padding:12px;min-height:46px;cursor:pointer}.btn:hover,.btn:focus{outline:1px solid var(--accent)}.row{display:flex;gap:9px;flex-wrap:wrap}.spacer{height:12px}.kv{display:grid;grid-template-columns:180px 1fr;gap:7px;font-size:12px}.kv b{color:var(--muted);font-weight:normal}.footer{border-top:1px solid var(--line);padding:8px 14px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.map{position:relative;height:510px;border:1px solid var(--line);background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),#080907;background-size:32px 32px;overflow:hidden}.uk{position:absolute;inset:7% 25% 8% 25%;border:1px solid color-mix(in srgb,var(--fg) 60%,transparent);clip-path:polygon(38% 0,63% 5%,75% 18%,68% 32%,86% 48%,72% 63%,78% 80%,56% 100%,38% 91%,26% 74%,5% 65%,17% 48%,9% 28%,28% 18%);background:color-mix(in srgb,var(--fg) 4%,transparent)}.marker{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;border:0;border-radius:50%;background:currentColor;box-shadow:0 0 4px currentColor;cursor:pointer;z-index:2}.marker:after{content:"";position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);border:1px solid currentColor;border-radius:50%;animation:pulse 1.8s ease-out infinite}.marker span{position:absolute;top:17px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:var(--fg2);text-shadow:0 0 4px #000}@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.7);opacity:.95}75%{transform:translate(-50%,-50%) scale(1.35);opacity:.25}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}.themeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.themeBtn{min-height:64px}.dialog{border:1px solid var(--line);background:#0b0906;padding:16px;max-width:600px;margin:55px auto}.notice{border-left:3px solid var(--accent);padding:10px;background:var(--panel2);font-size:11px;color:var(--fg2)}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field input{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);background:#070605;color:var(--fg)}
@media(max-width:760px){.topbar{height:58px;padding:0 12px}.brand{font-size:20px}.layout{flex-direction:column}.nav{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr);padding:8px}.navTitle{grid-column:1/-1}.nav button{min-height:43px}.content{padding:10px}.map{height:410px}.themeGrid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">ECTO OS</div><div class="topstatus">SYSTEM // OPERATIONAL<br>DATABASE // LOCAL</div></header>
<div class="layout">
<nav class="nav" id="nav">
<div class="navTitle">FIELD OPERATIONS SYSTEM</div>
<button data-route="response">RESPONSE MAP</button>
<button data-route="dispatch">ECTO DISPATCH</button>
<button data-route="spectres">SPECTRE DATABASE</button>
<button data-route="incidents">INCIDENT LOG</button>
<button data-route="grid">CONTAINMENT GRID</button>
<button data-route="diagnostics">DIAGNOSTICS</button>
<button data-route="config">CONFIGURATION</button>
</nav>
<main class="content"><div id="screen" class="screen"></div></main>
</div>
<footer class="footer"><span>ECTO OS // FIELD OPERATIONS SYSTEM</span><span id="saveStatus">DATABASE // READY</span></footer>
</div>
<script>
(()=>{"use strict";
const STORE="ecto-os-foundation-v2",PASS="ecto-os-admin-v2",DEFAULT="ECTO-ADMIN-1984";
const base={version:2,theme:"yellow",lastSaved:null,locations:[
{id:"LON-01",city:"London",severity:"green",lat:51.5074,lon:-.1278},
{id:"POR-01",city:"Portsmouth",severity:"yellow",lat:50.8198,lon:-1.088},
{id:"BHM-01",city:"Birmingham",severity:"green",lat:52.4862,lon:-1.8904},
{id:"MAN-01",city:"Manchester",severity:"orange",lat:53.4808,lon:-2.2426},
{id:"BRI-01",city:"Bristol",severity:"green",lat:51.4545,lon:-2.5879},
{id:"EDI-01",city:"Edinburgh",severity:"green",lat:55.9533,lon:-3.1883}],teams:[],vehicles:[],spectres:[],incidents:[],awe:[]};
let state=load(),route="response",unlocked=false;
function load(){try{return Object.assign(structuredClone(base),JSON.parse(localStorage.getItem(STORE))||{})}catch{return structuredClone(base)}}
function save(){state.lastSaved=new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(state));document.getElementById("saveStatus").textContent="DATABASE // SAVED "+new Date().toLocaleTimeString()}
function setRoute(r){route=r;render()} function guard(r){if(unlocked)setRoute(r);else{route="lock";render()}}
function theme(t){const a={green:["#050b07","#101d14","#254d31","#7bff8b","#c9ffd0","#57e06a"],yellow:["#090806","#141006","#73531f","#ffbd36","#ffe08a","#62df70"],blue:["#050914","#09162c","#234b78","#55a9ff","#b7ddff","#6bff9d"],orange:["#0c0704","#1d0f07","#70401e","#ff8a35","#ffd09a","#65df72"]}[t];["--bg","--panel","--line","--fg","--fg2","--ok"].forEach((k,i)=>document.documentElement.style.setProperty(k,a[i]));state.theme=t;save()}
function card(a,b,r){return `<button class="btn" data-sub="${r}"><b>${a}</b><div class="muted">${b}</div></button>`}
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.route===route));const s=document.getElementById("screen");if(route==="response")return response(s);if(route==="config")return config(s);if(route==="themes")return themes(s);if(route==="data")return data(s);if(route==="history")return history(s);if(route==="lock")return lock(s);return placeholder(s,route.toUpperCase())}
function response(s){const marks=state.locations.map(l=>{let x=25+((l.lon+8)/14)*50,y=12+((56-l.lat)/7)*76;x=Math.max(8,Math.min(92,x));y=Math.max(8,Math.min(92,y));const c={green:"var(--ok)",yellow:"#e8d34d",orange:"#ff8a35",red:"#ff5540",blue:"#54a9ff"}[l.severity]||"var(--ok)";return `<button class="marker" style="left:${x}%;top:${y}%;color:${c}" data-city="${l.city}"><span>${l.city}</span></button>`}).join("");s.innerHTML=`<h1>RESPONSE MAP</h1><div class="notice">UK response overview // select a city reticle to open its investigation-location file.</div><div class="spacer"></div><div class="map"><div class="uk"></div>${marks}</div><div class="spacer"></div><div class="card"><h2>RETICLE STATUS</h2><div class="kv"><b>GREEN</b><span class="ok">ROUTINE</span><b>YELLOW</b><span>ELEVATED</span><b>ORANGE</b><span style="color:#ff8a35">SERIOUS</span><b>RED</b><span class="danger">CRITICAL</span><b>BLUE</b><span class="blue">ALTERED WORLD EVENT</span></div></div>`}
function config(s){s.innerHTML=`<h1>CONFIGURATION</h1><div class="notice">ADMINISTRATOR ACCESS // ACTIVE</div><div class="spacer"></div><div class="grid">${card("LOCATION MANAGEMENT","Cities and investigation sites","placeholder")}${card("RESPONSE TEAM MANAGEMENT","Teams, members and assigned vehicles","placeholder")}${card("VEHICLE FLEET","Master vehicle records","placeholder")}${card("SYSTEM SETTINGS","CRT theme and preferences","themes")}${card("DATA MANAGEMENT","Protected import and export","data")}${card("SYSTEM HISTORY","Administrative history foundation","history")}</div>`}
function themes(s){s.innerHTML=`<h1>SYSTEM SETTINGS</h1><button class="btn" data-route="config">← CONFIGURATION</button><div class="spacer"></div><div class="card"><h2>CRT DISPLAY THEME</h2><div class="themeGrid">${[["green","GREEN CRT"],["yellow","70s YELLOW"],["blue","C64 BLUE"],["orange","80s PHOSPHOR ORANGE"]].map(x=>`<button class="btn themeBtn" data-theme="${x[0]}">${x[1]}</button>`).join("")}</div></div>`}
function data(s){s.innerHTML=`<h1>DATA MANAGEMENT</h1><div class="notice">IMPORT AND EXPORT ARE BOTH ADMINISTRATOR PROTECTED.</div><div class="spacer"></div><div class="grid"><button class="btn" data-export>EXPORT ECTO DATA<div class="muted">Create a complete versioned backup</div></button><button class="btn" data-import>IMPORT ECTO DATA<div class="muted">Restore a compatible backup</div></button></div><div class="spacer"></div><div class="card"><h2>DATABASE</h2><div class="kv"><b>VERSION</b><span>${state.version}</span><b>LAST SAVED</b><span>${state.lastSaved?new Date(state.lastSaved).toLocaleString():"NOT YET SAVED"}</span></div></div>`}
function history(s){s.innerHTML=`<h1>SYSTEM HISTORY</h1><button class="btn" data-route="config">← CONFIGURATION</button><div class="spacer"></div><div class="card"><div class="notice">AUDIT HISTORY FOUNDATION READY. Future builds will record administrator unlocks, changes, imports, exports and recovery actions.</div></div>`}
function lock(s){s.innerHTML=`<div class="dialog"><h1>ADMINISTRATOR ACCESS</h1><div class="notice">Configuration, import/export and system administration are protected.</div><div class="field"><label>ADMIN PASSCODE</label><input id="pass" type="password" placeholder="Enter passcode"></div><div class="row"><button class="btn" data-unlock>UNLOCK</button><button class="btn" data-route="response">CANCEL</button></div><p id="msg" class="danger"></p></div>`}
function placeholder(s,t){s.innerHTML=`<h1>${t}</h1><div class="card"><div class="notice">MODULE FRAMEWORK READY // FUNCTIONAL MODULE TO BE BUILT IN A LATER PHASE</div><p class="muted">Navigation and database architecture are reserved for this module.</p></div>`}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.route){const r=b.dataset.route;if(["config","data","themes","history"].includes(r))guard(r);else setRoute(r);return}
if(b.dataset.sub){setRoute(b.dataset.sub);return}
if(b.dataset.theme){theme(b.dataset.theme);render();return}
if(b.dataset.unlock){const v=document.getElementById("pass").value,s=localStorage.getItem(PASS);if(v&&(v===s||(!s&&v===DEFAULT))){if(!s)localStorage.setItem(PASS,v);unlocked=true;setRoute("config")}else document.getElementById("msg").textContent="ACCESS DENIED // INVALID PASSCODE";return}
if(b.dataset.city){alert("CITY FILE // "+b.dataset.city+"\nInvestigation Location files will be connected here.");return}
if(b.dataset.export){const payload={format:"ECTO-OS-BACKUP",version:2,created:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECTO-OS-Backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
if(b.dataset.import){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(p.format!=="ECTO-OS-BACKUP"||p.version!==2||!p.data)throw 0;if(!confirm("IMPORT ECTO OS DATA?\n\nThis replaces the current local database."))return;state=p.data;save();alert("ECTO OS DATA IMPORTED");render()}catch{alert("IMPORT FAILED // INVALID OR INCOMPATIBLE BACKUP")}};r.readAsText(f)};i.click();return}});theme(state.theme);render();save();
})();
</script>
</body>
</html>
