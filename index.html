<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090806"><title>ECTO OS // Phase 4</title>
<style>
:root{--bg:#090806;--panel:#151006;--panel2:#21170a;--line:#73531f;--fg:#ffbd36;--fg2:#ffe08a;--muted:#a48243;--ok:#62df70;--danger:#ff5540;--info:#54a9ff;--accent:#ffbd36;font-family:"Courier New",Courier,monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:inherit}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px);z-index:50}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 18px;background:var(--panel)}.brand{font-size:25px;letter-spacing:.08em}.topstat{font-size:10px;color:var(--ok);text-align:right}.layout{display:flex;flex:1;min-height:0}.nav{width:220px;flex:0 0 220px;padding:12px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:7px}.navTitle{font-size:10px;color:var(--muted);padding:3px}.nav button{min-height:47px;border:1px solid var(--line);background:#0d0a06;color:var(--fg);text-align:left;padding:9px;cursor:pointer}.nav button.active{border-color:var(--accent);background:var(--panel2);box-shadow:inset 3px 0 var(--accent)}.content{flex:1;min-width:0;overflow:auto;padding:16px}.screen{max-width:1250px;margin:auto}h1{font-size:21px;letter-spacing:.08em;margin:0 0 13px}h2{font-size:13px;color:var(--fg2);margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{border:1px solid var(--line);background:rgba(20,15,8,.93);padding:13px}.btn{border:1px solid var(--line);background:linear-gradient(#21170a,#0d0a06);color:var(--fg);padding:11px;min-height:44px;cursor:pointer}.btn:hover,.btn:focus{outline:1px solid var(--accent)}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{font-size:10px;color:var(--muted)}.danger{color:var(--danger)}.ok{color:var(--ok)}.blue{color:var(--info)}.field{margin:8px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;min-height:43px;padding:9px;border:1px solid var(--line);background:#070605;color:var(--fg);font:inherit}.field textarea{min-height:75px;resize:vertical}.footer{border-top:1px solid var(--line);padding:8px 13px;color:var(--muted);font-size:9px;display:flex;gap:15px;justify-content:space-between;flex-wrap:wrap}.map{height:520px;position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),#080907;background-size:32px 32px}.uk{position:absolute;inset:6% 24% 7% 24%;clip-path:polygon(39% 0,63% 5%,75% 17%,68% 31%,87% 48%,73% 63%,78% 80%,56% 100%,38% 91%,26% 74%,5% 65%,17% 48%,9% 28%,28% 18%);border:1px solid color-mix(in srgb,var(--fg) 55%,transparent);background:color-mix(in srgb,var(--fg) 4%,transparent)}.marker{position:absolute;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;cursor:pointer}.marker:after{content:"";position:absolute;width:30px;height:30px;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid currentColor;border-radius:50%;animation:pulse 1.8s ease-out infinite}.marker b{position:absolute;top:16px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--fg2);font-size:9px;text-shadow:0 0 4px #000;font-weight:normal}@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.7);opacity:.95}75%{transform:translate(-50%,-50%) scale(1.4);opacity:.2}100%{transform:translate(-50%,-50%) scale(1.55);opacity:0}}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}.list{display:flex;flex-direction:column;gap:7px}.item{border:1px solid var(--line);padding:10px;background:#0d0a06;cursor:pointer}.item:hover{border-color:var(--accent)}.pill{display:inline-block;border:1px solid currentColor;padding:2px 5px;font-size:9px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:40;display:flex;align-items:center;justify-content:center;padding:15px}.modalBox{width:min(760px,100%);max-height:90vh;overflow:auto;border:1px solid var(--accent);background:#0b0906;padding:16px}.hidden{display:none!important}.themeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.small{font-size:11px}.homeBtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.stat{font-size:18px;color:var(--fg2)}@media(max-width:850px){.nav{width:165px;flex-basis:165px}.split{grid-template-columns:1fr}.themeGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{height:auto;min-height:60px}.brand{font-size:18px}.layout{display:block}.nav{width:100%;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr)}.navTitle{grid-column:1/-1}.content{padding:10px}.map{height:430px}.uk{inset:7% 14% 8% 14%}}
@media print{body:before,.nav,.top,.footer,.modal>*,button{display:none!important}.content{padding:0}.screen{max-width:none}.card,.item,.notice{break-inside:avoid}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div>
<script>
const KEY='ecto-phase4-db';const ADMIN='ecto-phase4-admin';
const defaults={version:4,cities:[{id:'LON-01',name:'London',x:68,y:73,status:'routine',awe:false,locations:[{id:'LON-LOC-01',name:'Westminster Service Tunnel',grid:'TQ 298 796',description:'Subterranean municipal access route.',status:'routine'}]},{id:'POR-01',name:'Portsmouth',x:55,y:82,status:'elevated',awe:false,locations:[{id:'POR-LOC-01',name:'Historic Dockyard',grid:'SZ 632 998',description:'Historic naval complex and investigation zone.',status:'elevated'}]},{id:'BHM-01',name:'Birmingham',x:55,y:57,status:'routine',awe:false,locations:[]},{id:'MAN-01',name:'Manchester',x:49,y:43,status:'serious',awe:false,locations:[]},{id:'BRI-01',name:'Bristol',x:42,y:72,status:'routine',awe:false,locations:[]},{id:'EDI-01',name:'Edinburgh',x:52,y:18,status:'routine',awe:false,locations:[]}],teams:[{id:'TEAM-01',name:'TEAM ALPHA',vehicleId:'ECTO-19',status:'available',members:[{id:'M-01',name:'Peter',position:'Team Leader'},{id:'M-02',name:'Ray',position:'Technician'},{id:'M-03',name:'Egon',position:'Engineer'},{id:'M-04',name:'Winston',position:'Driver'}]}],vehicles:[{id:'ECTO-19',designation:'ECTO 19',role:'Mobile containment',status:'available'}],spectres:[{id:'SP-0001',designation:'SP-0001',name:'Class I Residual',classId:'I',description:'Low-level residual manifestation.',effects:'Minor temperature and electromagnetic anomalies.',hazards:'Low.',notes:'Baseline database record.'}],awes:[],incidents:[],active:null,history:[]};
let db=load();let page='home';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===4)return x;if(x&&x.version===3){x.version=4;x.spectres=x.spectres||structuredClone(defaults.spectres);x.awes=x.awes||[];x.teams=(x.teams||[]).map(t=>({...t,status:t.status||'available'}));x.incidents=(x.incidents||[]).map(i=>({...i,initialPke:i.initialPke||'',peakPke:i.peakPke||'',finalPke:i.finalPke||'',spectreId:i.spectreId||'',aweId:i.aweId||'',summary:i.summary||'',observations:i.observations||'',hazards:i.hazards||'',containment:i.containment||'',officerNotes:i.officerNotes||'',evidence:i.evidence||[]}));return x}return structuredClone(defaults)}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function log(msg){db.history.unshift(new Date().toISOString().slice(0,16).replace('T',' ')+' // '+msg);db.history=db.history.slice(0,100);save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusColor(s,awe){return awe?'#54a9ff':({routine:'#62df70',elevated:'#ffe04d',serious:'#ff9d36',critical:'#ff5540'}[s]||'#ffbd36')}
function nav(){return `<aside class="nav"><div class="navTitle">FIELD OPERATIONS</div>${[['home','MAIN MENU'],['map','RESPONSE MAP'],['dispatch','ECTO DISPATCH'],['spectre','SPECTRE DATABASE'],['incidents','INCIDENT LOG'],['grid','CONTAINMENT GRID'],['diag','DIAGNOSTICS'],['config','CONFIGURATION']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</aside>`}
function shell(){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand">ECTO OS</div><div class="topstat">FIELD OPERATIONS SYSTEM<br><span class="ok">SYSTEM: OPERATIONAL</span></div></header><div class="layout">${nav()}<main class="content"><div class="screen">${render()}</div></main></div><footer class="footer"><span>ECTO OS // FIELD OPERATIONS SYSTEM</span><span>NETWORK: LOCAL // DATABASE: ONLINE // FIELD UNITS: ${db.teams.length}</span><span>ACTIVE INCIDENTS: ${db.incidents.length}</span></footer></div>`}
function go(p){page=p;shell()}
function render(){if(page==='home')return home();if(page==='map')return map();if(page==='dispatch')return dispatch();if(page==='spectre')return spectrePage();if(page==='incidents')return incidents();if(page==='config')return config();return placeholder(page.toUpperCase())}
function home(){return `<h1>ECTO OS</h1><div class="muted">FIELD OPERATIONS SYSTEM</div><div class="spacer"></div><div class="homeBtns">${[['map','RESPONSE MAP'],['dispatch','ECTO DISPATCH'],['spectre','SPECTRE DATABASE'],['incidents','INCIDENT LOG'],['grid','CONTAINMENT GRID'],['diag','DIAGNOSTICS'],['config','CONFIGURATION']].map(x=>`<button class="btn" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="spacer"></div><div class="grid"><div class="card"><div class="muted">CITIES</div><div class="stat">${db.cities.length}</div></div><div class="card"><div class="muted">RESPONSE TEAMS</div><div class="stat">${db.teams.length}</div></div><div class="card"><div class="muted">VEHICLES</div><div class="stat">${db.vehicles.length}</div></div><div class="card"><div class="muted">INCIDENTS</div><div class="stat">${db.incidents.length}</div></div><div class="card"><div class="muted">SPECTRES</div><div class="stat">${db.spectres.length}</div></div><div class="card"><div class="muted">AWE EVENTS</div><div class="stat">${db.awes.length}</div></div></div>`}
function map(){return `<h1>RESPONSE MAP</h1><div class="split"><div class="map"><div class="uk"></div>${db.cities.map(c=>{const blue=c.awe||db.awes.some(a=>a.cityId===c.id&&a.status==='active');return `<div class="marker" style="left:${c.x}%;top:${c.y}%;color:${statusColor(c.status,blue)}" onclick="city('${c.id}')"><b>${esc(c.name)}</b></div>`}).join('')}</div><div class="card"><h2>RESPONSE STATUS</h2><div class="list">${db.cities.map(c=>`<div class="item" onclick="city('${c.id}')"><b>${esc(c.name)}</b><br><span style="color:${statusColor(c.status,c.awe||db.awes.some(a=>a.cityId===c.id&&a.status==='active'))}">${c.awe||db.awes.some(a=>a.cityId===c.id&&a.status==='active')?'AWE':c.status.toUpperCase()}</span><br><span class="muted">${c.locations.length} investigation location(s)</span></div>`).join('')}</div></div></div>`}
function city(id){const c=db.cities.find(x=>x.id===id);if(!c)return;openModal(`<h1>${esc(c.name)} // INVESTIGATION FILE</h1><div class="muted">${c.id}</div><div class="spacer"></div><h2>INVESTIGATION LOCATIONS</h2><div class="list">${c.locations.length?c.locations.map(l=>`<div class="item" onclick="locationFile('${c.id}','${l.id}')"><b>${esc(l.name)}</b><br><span class="muted">GRID: ${esc(l.grid)} // STATUS: ${esc(l.status).toUpperCase()}</span></div>`).join(''):`<div class="notice">NO INVESTIGATION LOCATIONS REGISTERED.</div>`}</div><div class="spacer"></div><button class="btn" onclick="closeModal();go('dispatch')">SELECT RESPONSE TEAM</button>`)}
function locationFile(cid,lid){const c=db.cities.find(x=>x.id===cid),l=c?.locations.find(x=>x.id===lid);if(!l)return;openModal(`<h1>${esc(l.name)}</h1><div class="kv"><b>CITY</b><span>${esc(c.name)}</span><b>GRID</b><span>${esc(l.grid)}</span><b>STATUS</b><span>${esc(l.status).toUpperCase()}</span></div><div class="spacer"></div><div class="notice">${esc(l.description)}</div><div class="spacer"></div><button class="btn" onclick="closeModal();go('dispatch')">DISPATCH TO THIS LOCATION</button>`)}
function dispatch(){const a=db.active;return `<h1>ECTO DISPATCH</h1>${a?activeDispatch(a):dispatchStart()}`}
function dispatchStart(){return `<div class="split"><div class="card"><h2>SELECT CITY</h2><div class="list">${db.cities.map(c=>`<button class="item" onclick="pickDispatchCity('${c.id}')"><b>${esc(c.name)}</b><br><span class="muted">${c.locations.length} LOCATION(S)</span></button>`).join('')}</div></div><div class="card"><h2>DISPATCH WORKFLOW</h2><div class="notice">CITY → INVESTIGATION LOCATION → RESPONSE TEAM → PRE-FLIGHT → DISPATCH VEHICLE → INVESTIGATION → RETURN TO HQ → INCIDENT LOG</div></div></div>`}
function pickDispatchCity(id){const c=db.cities.find(x=>x.id===id);if(!c||!c.locations.length){alert('No investigation location is configured for this city.');return}openModal(`<h1>${esc(c.name)}</h1><h2>INVESTIGATION LOCATION</h2><div class="list">${c.locations.map(l=>`<button class="item" onclick="pickTeam('${c.id}','${l.id}')"><b>${esc(l.name)}</b><br><span class="muted">${esc(l.grid)} // ${l.status.toUpperCase()}</span></button>`).join('')}</div>`)}
function pickTeam(cid,lid){const c=db.cities.find(x=>x.id===cid),l=c.locations.find(x=>x.id===lid);openModal(`<h1>RESPONSE TEAM</h1><div class="list">${db.teams.map(t=>`<button class="item" onclick="preflight('${cid}','${lid}','${t.id}')"><b>${esc(t.name)}</b><br><span class="muted">VEHICLE: ${esc(vehicleFor(t)?.designation||'NONE')}</span></button>`).join('')}</div>`)}
function vehicleFor(t){return db.vehicles.find(v=>v.id===t.vehicleId)}
function preflight(cid,lid,tid){const t=db.teams.find(x=>x.id===tid),v=vehicleFor(t);if(!v){alert('Team has no assigned vehicle. Configure the team first.');closeModal();return}openModal(`<h1>PRE-FLIGHT</h1><div class="notice">${esc(t.name)} // ${esc(v.designation)}</div><div class="field"><label>PRIMARY EQUIPMENT</label><select id="pfPrimary"><option value="Proton Pack">PROTON PACK</option><option value="Slime Blower">SLIME BLOWER</option></select></div><div class="field"><label>FIELD EQUIPMENT</label><select id="pfEquip" multiple size="4"><option>PKE Meter</option><option>Ecto-Goggles</option><option>Trap</option><option>Giga-Meter</option></select></div><button class="btn" onclick="startDispatch('${cid}','${lid}','${tid}')">DISPATCH VEHICLE</button>`)}
function startDispatch(cid,lid,tid){const c=db.cities.find(x=>x.id===cid),l=c.locations.find(x=>x.id===lid),t=db.teams.find(x=>x.id===tid),v=vehicleFor(t),primary=document.getElementById('pfPrimary').value,eq=[...document.getElementById('pfEquip').selectedOptions].map(o=>o.value);db.active={id:'ACT-'+Date.now(),cityId:cid,locationId:lid,teamId:tid,vehicleId:v.id,primary,equipment:eq,stage:'EN ROUTE',started:new Date().toISOString(),initialPke:'',peakPke:'',finalPke:'',spectreId:'',aweId:'',summary:'',observations:'',hazards:'',containment:'',officerNotes:'',evidence:[]};v.status='deployed';t.status='en route';log(`DISPATCH // ${t.name} // ${v.designation} // ${l.name}`);closeModal();shell()}
function activeDispatch(a){const c=db.cities.find(x=>x.id===a.cityId),l=c.locations.find(x=>x.id===a.locationId),t=db.teams.find(x=>x.id===a.teamId),v=vehicleFor(t);return `<div class="card"><div class="muted">ACTIVE DEPLOYMENT</div><h2>${esc(t.name)} // ${esc(v.designation)}</h2><div class="kv"><b>LOCATION</b><span>${esc(c.name)} // ${esc(l.name)}</span><b>STAGE</b><span class="ok">${esc(a.stage)}</span><b>PRIMARY</b><span>${esc(a.primary)}</span><b>EQUIPMENT</b><span>${esc(a.equipment.join(', ')||'NONE')}</span></div><div class="spacer"></div><div class="row">${['PROCEED TO LOCATION','BEGIN INVESTIGATION','HOLD POSITION','RETURN TO VEHICLE'].map(x=>`<button class="btn" onclick="order('${x}')">${x}</button>`).join('')}<button class="btn" onclick="completeForm()">COMPLETE INVESTIGATION</button></div></div>`}
function order(x){db.active.stage=x;log(`ORDER // ${x}`);save();shell()}
function completeInvestigation(){const a=db.active;if(!a)return;const c=db.cities.find(x=>x.id===a.cityId),l=c.locations.find(x=>x.id===a.locationId),t=db.teams.find(x=>x.id===a.teamId),v=vehicleFor(t);const incident={id:'ECTO-'+new Date().getFullYear()+'-'+String(db.incidents.length+1).padStart(4,'0'),date:new Date().toISOString(),city:c.name,location:l.name,team:t.name,vehicle:v.designation,primary:a.primary,equipment:a.equipment,initialPke:a.initialPke||'',peakPke:a.peakPke||'',finalPke:a.finalPke||'',spectreId:a.spectreId||'',aweId:a.aweId||'',summary:a.summary||'Investigation completed.',observations:a.observations||'',hazards:a.hazards||'',containment:a.containment||'Not recorded',officerNotes:a.officerNotes||'',evidence:a.evidence||[],result:'INVESTIGATION COMPLETE'};db.incidents.unshift(incident);v.status='available';t.status='available';log(`INVESTIGATION COMPLETE // ${l.name} // ${t.name} // ${incident.id}`);db.active=null;save();shell();incident(incident.id)}
function completeForm(){const a=db.active;if(!a)return;openModal(`<h1>COMPLETE INVESTIGATION</h1><div class="notice">${esc(a.id)} // FINAL FIELD REPORT</div><div class="field"><label>INITIAL PKe</label><input id="cp0" inputmode="numeric" value="${esc(a.initialPke||'')}"></div><div class="field"><label>PEAK PKe</label><input id="cp1" inputmode="numeric" value="${esc(a.peakPke||'')}"></div><div class="field"><label>FINAL PKe</label><input id="cp2" inputmode="numeric" value="${esc(a.finalPke||'')}"></div><div class="field"><label>SPECTRE / AWE</label><select id="cp3"><option value="">NONE RECORDED</option>${db.spectres.map(x=>`<option value="${x.id}" ${a.spectreId===x.id?'selected':''}>${esc(x.designation)} // ${esc(x.name)}</option>`).join('')} ${db.awes.map(x=>`<option value="AWE:${x.id}" ${a.aweId===x.id?'selected':''}>${esc(x.designation)} // AWE</option>`).join('')}</select></div><div class="field"><label>INVESTIGATION SUMMARY</label><textarea id="cp4">${esc(a.summary||'')}</textarea></div><div class="field"><label>FIELD OBSERVATIONS</label><textarea id="cp5">${esc(a.observations||'')}</textarea></div><div class="field"><label>HAZARDS</label><textarea id="cp6">${esc(a.hazards||'')}</textarea></div><div class="field"><label>CONTAINMENT RESULT</label><textarea id="cp7">${esc(a.containment||'')}</textarea></div><div class="field"><label>OFFICER NOTES</label><textarea id="cp8">${esc(a.officerNotes||'')}</textarea></div><button class="btn" onclick="finishReport()">COMPLETE & RETURN TO HQ</button>`)}
function finishReport(){const a=db.active;if(!a)return;a.initialPke=document.getElementById('cp0').value;a.peakPke=document.getElementById('cp1').value;a.finalPke=document.getElementById('cp2').value;const sel=document.getElementById('cp3').value;if(sel.startsWith('AWE:')){a.aweId=sel.slice(4);a.spectreId=''}else{a.spectreId=sel;a.aweId=''}a.summary=document.getElementById('cp4').value;a.observations=document.getElementById('cp5').value;a.hazards=document.getElementById('cp6').value;a.containment=document.getElementById('cp7').value;a.officerNotes=document.getElementById('cp8').value;closeModal();completeInvestigation()}
function incidents(){return `<h1>INCIDENT LOG</h1><div class="list">${db.incidents.length?db.incidents.map(i=>`<div class="item" onclick="incident('${i.id}')"><b>${esc(i.id)}</b><br>${esc(i.city)} // ${esc(i.location)}<br><span class="muted">${esc(i.team)} // ${esc(i.vehicle)} // ${new Date(i.date).toLocaleString()}</span><br><span class="pill">${esc(i.spectreId?((db.spectres.find(s=>s.id===i.spectreId)||{}).name||i.spectreId):i.aweId?'AWE':'NO ENTITY')}</span></div>`).join(''):`<div class="notice">NO INCIDENTS RECORDED.</div>`}</div>`}
function incident(id){const i=db.incidents.find(x=>x.id===id);if(!i)return;const sp=db.spectres.find(s=>s.id===i.spectreId),awe=db.awes.find(a=>a.id===i.aweId);openModal(`<h1>${esc(i.id)}</h1><div class="kv"><b>DATE / TIME</b><span>${new Date(i.date).toLocaleString()}</span><b>LOCATION</b><span>${esc(i.city)} // ${esc(i.location)}</span><b>RESPONSE TEAM</b><span>${esc(i.team)}</span><b>VEHICLE</b><span>${esc(i.vehicle)}</span><b>PRIMARY</b><span>${esc(i.primary)}</span><b>EQUIPMENT</b><span>${esc(i.equipment.join(', ')||'NONE')}</span><b>INITIAL PKe</b><span>${esc(i.initialPke||'—')}</span><b>PEAK PKe</b><span>${esc(i.peakPke||'—')}</span><b>FINAL PKe</b><span>${esc(i.finalPke||'—')}</span><b>ENTITY</b><span>${esc(sp?sp.designation+' // '+sp.name:awe?awe.designation+' // AWE':'NONE')}</span><b>RESULT</b><span class="ok">${esc(i.result)}</span></div><div class="spacer"></div><h2>INVESTIGATION SUMMARY</h2><div class="notice">${esc(i.summary||'—')}</div><h2>FIELD OBSERVATIONS</h2><div class="notice">${esc(i.observations||'—')}</div><h2>HAZARDS</h2><div class="notice">${esc(i.hazards||'—')}</div><h2>CONTAINMENT RESULT</h2><div class="notice">${esc(i.containment||'—')}</div><h2>OFFICER NOTES</h2><div class="notice">${esc(i.officerNotes||'—')}</div><h2>EVIDENCE</h2><div class="list">${(i.evidence||[]).map(e=>`<div class="item"><b>${esc(e.type||'FIELD RECORD')}</b><br>${esc(e.description||'')}</div>`).join('')||'<div class="notice">NO EVIDENCE ATTACHED.</div>'}</div><div class="spacer"></div><button class="btn" onclick="editIncident('${i.id}')">EDIT REPORT</button><button class="btn" onclick="exportIncident('${i.id}')">EXPORT REPORT</button><button class="btn" onclick="window.print()">PRINT REPORT</button>`)}
function editIncident(id){const i=db.incidents.find(x=>x.id===id);openModal(`<h1>EDIT INCIDENT REPORT</h1><div class="field"><label>SUMMARY</label><textarea id="ei1">${esc(i.summary)}</textarea></div><div class="field"><label>OBSERVATIONS</label><textarea id="ei2">${esc(i.observations)}</textarea></div><div class="field"><label>HAZARDS</label><textarea id="ei3">${esc(i.hazards)}</textarea></div><div class="field"><label>CONTAINMENT RESULT</label><textarea id="ei4">${esc(i.containment)}</textarea></div><div class="field"><label>OFFICER NOTES</label><textarea id="ei5">${esc(i.officerNotes)}</textarea></div><div class="field"><label>EVIDENCE // one item per line</label><textarea id="ei6">${esc((i.evidence||[]).map(e=>(e.type||'FIELD RECORD')+' | '+(e.description||'')).join('\n'))}</textarea></div><button class="btn" onclick="saveIncident('${id}')">SAVE REPORT</button>`)}
function saveIncident(id){const i=db.incidents.find(x=>x.id===id);i.summary=document.getElementById('ei1').value;i.observations=document.getElementById('ei2').value;i.hazards=document.getElementById('ei3').value;i.containment=document.getElementById('ei4').value;i.officerNotes=document.getElementById('ei5').value;i.evidence=document.getElementById('ei6').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split('|');return {type:(p.shift()||'FIELD RECORD').trim(),description:p.join('|').trim()}});log(`INCIDENT REPORT UPDATED // ${id}`);save();incident(id)}
function exportIncident(id){const i=db.incidents.find(x=>x.id===id);const b=new Blob([JSON.stringify({format:'ECTO-OS-INCIDENT-REPORT',version:1,created:new Date().toISOString(),incident:i},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=id+'.json';a.click();URL.revokeObjectURL(a.href);log(`INCIDENT REPORT EXPORTED // ${id}`)}
function spectrePage(){return `<h1>SPECTRE DATABASE</h1><div class="grid"><div class="card"><h2>CDI CLASSES</h2><div class="row">${['I','II','III','IV','V','VI','VII'].map(c=>`<button class="btn" onclick="spectreClass('${c}')">CLASS ${c}</button>`).join('')}</div></div><div class="card"><h2>RECORDS</h2><div class="list">${db.spectres.map(s=>`<div class="item" onclick="spectreFile('${s.id}')"><b>${esc(s.designation)}</b><br>${esc(s.name)}<br><span class="muted">CDI CLASS ${esc(s.classId)}</span></div>`).join('')}</div><button class="btn" onclick="addSpectre()">ADD SPECTRE</button></div></div>`}
function spectreClass(cls){openModal(`<h1>CDI CLASS ${cls}</h1><div class="notice">CLASS ${cls} // FIELD CLASSIFICATION</div><div class="spacer"></div><div class="list">${db.spectres.filter(s=>s.classId===cls).map(s=>`<div class="item" onclick="spectreFile('${s.id}')"><b>${esc(s.designation)}</b><br>${esc(s.name)}</div>`).join('')||'<div class="notice">NO SPECTRE RECORDS IN THIS CLASS.</div>'}</div>`)}
function spectreFile(id){const s=db.spectres.find(x=>x.id===id);if(!s)return;openModal(`<h1>SPECTRE DOSSIER</h1><div class="kv"><b>DESIGNATION</b><span>${esc(s.designation)}</span><b>COMMON NAME</b><span>${esc(s.name)}</span><b>CDI CLASS</b><span>CLASS ${esc(s.classId)}</span></div><h2>DESCRIPTION</h2><div class="notice">${esc(s.description)}</div><h2>KNOWN EFFECTS</h2><div class="notice">${esc(s.effects)}</div><h2>KNOWN HAZARDS</h2><div class="notice">${esc(s.hazards)}</div><h2>FIELD NOTES</h2><div class="notice">${esc(s.notes)}</div><div class="spacer"></div><button class="btn" onclick="editSpectre('${id}')">EDIT DOSSIER</button>`)}
function addSpectre(){db.spectres.push({id:'SP-'+String(Date.now()).slice(-5),designation:'SP-NEW',name:'New Spectre',classId:'I',description:'',effects:'',hazards:'',notes:''});save();spectrePage()}
function editSpectre(id){const s=db.spectres.find(x=>x.id===id);openModal(`<h1>EDIT SPECTRE</h1><div class="field"><label>DESIGNATION</label><input id="sd" value="${esc(s.designation)}"></div><div class="field"><label>COMMON NAME</label><input id="sn" value="${esc(s.name)}"></div><div class="field"><label>CDI CLASS</label><select id="sc">${['I','II','III','IV','V','VI','VII'].map(c=>`<option ${s.classId===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>DESCRIPTION</label><textarea id="sx">${esc(s.description)}</textarea></div><div class="field"><label>KNOWN EFFECTS</label><textarea id="se">${esc(s.effects)}</textarea></div><div class="field"><label>KNOWN HAZARDS</label><textarea id="sh">${esc(s.hazards)}</textarea></div><div class="field"><label>FIELD NOTES</label><textarea id="so">${esc(s.notes)}</textarea></div><button class="btn" onclick="saveSpectre('${id}')">SAVE DOSSIER</button>`)}
function saveSpectre(id){const s=db.spectres.find(x=>x.id===id);s.designation=document.getElementById('sd').value;s.name=document.getElementById('sn').value;s.classId=document.getElementById('sc').value;s.description=document.getElementById('sx').value;s.effects=document.getElementById('se').value;s.hazards=document.getElementById('sh').value;s.notes=document.getElementById('so').value;log(`SPECTRE UPDATED // ${s.designation}`);save();spectreFile(id)}
function config(){return `<h1>CONFIGURATION</h1><div class="grid"><button class="btn" onclick="locationManager()">LOCATION MANAGEMENT</button><button class="btn" onclick="teamManager()">RESPONSE TEAM MANAGEMENT</button><button class="btn" onclick="vehicleManager()">VEHICLE FLEET</button><button class="btn" onclick="aweManager()">AWE DATABASE</button><button class="btn" onclick="dataManager()">DATA MANAGEMENT</button><button class="btn" onclick="settings()">SYSTEM SETTINGS</button><button class="btn" onclick="historyView()">SYSTEM HISTORY</button></div>`}
function auth(next){if(localStorage.getItem(ADMIN)==='ok'){next();return}const p=prompt('ECTO ADMIN PASSCODE');if(p==='ECTO-ADMIN-1984'){localStorage.setItem(ADMIN,'ok');next()}else alert('ACCESS DENIED')}
function locationManager(){auth(()=>openModal(`<h1>LOCATION MANAGEMENT</h1><div class="list">${db.cities.map(c=>`<div class="item"><b>${esc(c.name)}</b> <span class="muted">${c.id}</span><div class="row"><button class="btn" onclick="editCity('${c.id}')">EDIT</button><button class="btn" onclick="addLocation('${c.id}')">ADD SITE</button><button class="btn" onclick="deleteCity('${c.id}')">DELETE</button></div><div class="small">${c.locations.map(l=>`${esc(l.name)} <button class="btn" onclick="editLocation('${c.id}','${l.id}')">EDIT</button>`).join('<br>')}</div></div>`).join('')}<button class="btn" onclick="addCity()">ADD CITY</button></div>`))}
function editCity(id){const c=db.cities.find(x=>x.id===id);openModal(`<h1>EDIT CITY</h1><div class="field"><label>CITY NAME</label><input id="eName" value="${esc(c.name)}"></div><div class="field"><label>STATUS</label><select id="eStatus"><option ${c.status==='routine'?'selected':''}>routine</option><option ${c.status==='elevated'?'selected':''}>elevated</option><option ${c.status==='serious'?'selected':''}>serious</option><option ${c.status==='critical'?'selected':''}>critical</option></select></div><button class="btn" onclick="saveCity('${id}')">SAVE CITY</button>`)}
function saveCity(id){const c=db.cities.find(x=>x.id===id);c.name=document.getElementById('eName').value;c.status=document.getElementById('eStatus').value;log(`CITY UPDATED // ${c.name}`);save();locationManager()}
function addCity(){openModal(`<h1>ADD CITY</h1><div class="field"><label>CITY NAME</label><input id="nCity"></div><div class="field"><label>MAP X %</label><input id="nX" type="number" value="50"></div><div class="field"><label>MAP Y %</label><input id="nY" type="number" value="50"></div><button class="btn" onclick="saveNewCity()">ADD CITY</button>`)}
function saveNewCity(){const n=document.getElementById('nCity').value.trim();if(!n)return;const id=n.toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,8)+'-'+String(Date.now()).slice(-2);db.cities.push({id,name:n,x:+document.getElementById('nX').value,y:+document.getElementById('nY').value,status:'routine',awe:false,locations:[]});log(`CITY ADDED // ${n}`);save();locationManager()}
function deleteCity(id){if(!confirm('Delete this city and its investigation locations?'))return;db.cities=db.cities.filter(c=>c.id!==id);log(`CITY DELETED // ${id}`);save();locationManager()}
function addLocation(cid){openModal(`<h1>ADD INVESTIGATION LOCATION</h1><div class="field"><label>LOCATION NAME</label><input id="lName"></div><div class="field"><label>GRID REFERENCE</label><input id="lGrid"></div><div class="field"><label>DESCRIPTION</label><textarea id="lDesc"></textarea></div><button class="btn" onclick="saveLocation('${cid}')">ADD LOCATION</button>`)}
function saveLocation(cid){const c=db.cities.find(x=>x.id===cid);const n=document.getElementById('lName').value.trim();if(!n)return;c.locations.push({id:'LOC-'+Date.now(),name:n,grid:document.getElementById('lGrid').value,description:document.getElementById('lDesc').value,status:'routine'});log(`LOCATION ADDED // ${n}`);save();locationManager()}
function editLocation(cid,lid){const c=db.cities.find(x=>x.id===cid),l=c.locations.find(x=>x.id===lid);openModal(`<h1>EDIT INVESTIGATION LOCATION</h1><div class="field"><label>LOCATION NAME</label><input id="elName" value="${esc(l.name)}"></div><div class="field"><label>GRID</label><input id="elGrid" value="${esc(l.grid)}"></div><div class="field"><label>DESCRIPTION</label><textarea id="elDesc">${esc(l.description)}</textarea></div><button class="btn" onclick="saveLocationEdit('${cid}','${lid}')">SAVE</button> <button class="btn" onclick="deleteLocation('${cid}','${lid}')">DELETE</button>`)}
function saveLocationEdit(cid,lid){const c=db.cities.find(x=>x.id===cid),l=c.locations.find(x=>x.id===lid);l.name=document.getElementById('elName').value;l.grid=document.getElementById('elGrid').value;l.description=document.getElementById('elDesc').value;log(`LOCATION UPDATED // ${l.name}`);save();locationManager()}
function deleteLocation(cid,lid){const c=db.cities.find(x=>x.id===cid);c.locations=c.locations.filter(l=>l.id!==lid);log(`LOCATION DELETED // ${lid}`);save();locationManager()}
function teamManager(){auth(()=>openModal(`<h1>RESPONSE TEAM MANAGEMENT</h1><div class="list">${db.teams.map(t=>`<div class="item"><b>${esc(t.name)}</b><br><span class="muted">VEHICLE: ${esc(vehicleFor(t)?.designation||'NONE')}</span><div class="row"><button class="btn" onclick="editTeam('${t.id}')">EDIT TEAM</button><button class="btn" onclick="deleteTeam('${t.id}')">DELETE</button></div></div>`).join('')}<button class="btn" onclick="addTeam()">ADD TEAM</button></div>`))}
function editTeam(id){const t=db.teams.find(x=>x.id===id);openModal(`<h1>TEAM EDITOR</h1><div class="field"><label>TEAM NAME</label><input id="tName" value="${esc(t.name)}"></div><div class="field"><label>ASSIGNED VEHICLE</label><select id="tVehicle"><option value="">NONE</option>${db.vehicles.map(v=>`<option value="${v.id}" ${t.vehicleId===v.id?'selected':''}>${esc(v.designation)}</option>`).join('')}</select></div><h2>TEAM MEMBERS</h2><div id="members">${t.members.map((m,i)=>`<div class="row"><input id="mn${i}" value="${esc(m.name)}"><select id="mp${i}">${['Team Leader','Driver','Technician','Engineer','Paramusicologist','Parabotanist','Paraforensic Investigator'].map(p=>`<option ${m.position===p?'selected':''}>${p}</option>`).join('')}</select></div>`).join('')}</div><div class="spacer"></div><button class="btn" onclick="addMember('${id}')">ADD MEMBER</button> <button class="btn" onclick="saveTeam('${id}')">SAVE TEAM</button>`)}
function addMember(id){const t=db.teams.find(x=>x.id===id);t.members.push({id:'M-'+Date.now(),name:'New Member',position:'Technician'});editTeam(id)}
function saveTeam(id){const t=db.teams.find(x=>x.id===id);t.name=document.getElementById('tName').value;t.vehicleId=document.getElementById('tVehicle').value; t.members=t.members.map((m,i)=>({id:m.id,name:document.getElementById('mn'+i)?.value||m.name,position:document.getElementById('mp'+i)?.value||m.position}));log(`TEAM UPDATED // ${t.name}`);save();teamManager()}
function addTeam(){db.teams.push({id:'TEAM-'+Date.now(),name:'NEW TEAM',vehicleId:'',members:[]});save();teamManager()}
function deleteTeam(id){if(!confirm('Delete response team?'))return;db.teams=db.teams.filter(t=>t.id!==id);save();teamManager()}
function vehicleManager(){auth(()=>openModal(`<h1>VEHICLE FLEET</h1><div class="list">${db.vehicles.map(v=>`<div class="item"><b>${esc(v.designation)}</b><br>${esc(v.role)} // <span class="${v.status==='available'?'ok':''}">${esc(v.status).toUpperCase()}</span><div class="row"><button class="btn" onclick="editVehicle('${v.id}')">EDIT</button><button class="btn" onclick="deleteVehicle('${v.id}')">DELETE</button></div></div>`).join('')}<button class="btn" onclick="addVehicle()">ADD VEHICLE</button></div>`))}
function editVehicle(id){const v=db.vehicles.find(x=>x.id===id);openModal(`<h1>EDIT VEHICLE</h1><div class="field"><label>DESIGNATION</label><input id="vd" value="${esc(v.designation)}"></div><div class="field"><label>ROLE</label><input id="vr" value="${esc(v.role)}"></div><button class="btn" onclick="saveVehicle('${id}')">SAVE VEHICLE</button>`)}
function saveVehicle(id){const v=db.vehicles.find(x=>x.id===id);v.designation=document.getElementById('vd').value;v.role=document.getElementById('vr').value;log(`VEHICLE UPDATED // ${v.designation}`);save();vehicleManager()}
function addVehicle(){db.vehicles.push({id:'VEH-'+Date.now(),designation:'NEW ECTO',role:'Mobile response',status:'available'});save();vehicleManager()}
function deleteVehicle(id){if(db.teams.some(t=>t.vehicleId===id)){alert('Vehicle is assigned to a team. Remove the assignment first.');return}db.vehicles=db.vehicles.filter(v=>v.id!==id);save();vehicleManager()}
function aweManager(){auth(()=>openModal(`<h1>AWE DATABASE</h1><div class="list">${db.awes.map(a=>`<div class="item"><b>${esc(a.designation)}</b><br>CLASS ${esc(a.classId)} // ${esc(a.status)}<div class="row"><button class="btn" onclick="editAwe('${a.id}')">EDIT</button><button class="btn" onclick="deleteAwe('${a.id}')">DELETE</button></div></div>`).join('')||'<div class="notice">NO AWE EVENTS REGISTERED.</div>'}<button class="btn" onclick="addAwe()">ADD AWE</button></div>`))}
function addAwe(){db.awes.push({id:'AWE-'+String(Date.now()).slice(-5),designation:'AWE-NEW',cityId:'',locationId:'',classId:'V',status:'active',description:'',effects:'',hazards:'',response:'',notes:''});save();aweManager()}
function editAwe(id){const a=db.awes.find(x=>x.id===id);openModal(`<h1>EDIT AWE</h1><div class="field"><label>EVENT DESIGNATION</label><input id="ad" value="${esc(a.designation)}"></div><div class="field"><label>CITY</label><select id="acity"><option value="">UNASSIGNED</option>${db.cities.map(c=>`<option value="${c.id}" ${a.cityId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>CDI CLASS</label><select id="ac">${['I','II','III','IV','V','VI','VII'].map(c=>`<option ${a.classId===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>STATUS</label><select id="ast">${['active','contained','resolved','monitoring'].map(c=>`<option ${a.status===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>DESCRIPTION</label><textarea id="ax">${esc(a.description)}</textarea></div><div class="field"><label>PHENOMENOLOGICAL EFFECTS</label><textarea id="ae">${esc(a.effects)}</textarea></div><div class="field"><label>KNOWN HAZARDS</label><textarea id="ah">${esc(a.hazards)}</textarea></div><div class="field"><label>FIELD RESPONSE</label><textarea id="ar">${esc(a.response)}</textarea></div><div class="field"><label>ECTO NOTES</label><textarea id="an">${esc(a.notes)}</textarea></div><button class="btn" onclick="saveAwe('${id}')">SAVE AWE</button>`)}
function saveAwe(id){const a=db.awes.find(x=>x.id===id);a.designation=document.getElementById('ad').value;a.cityId=document.getElementById('acity').value;a.classId=document.getElementById('ac').value;a.status=document.getElementById('ast').value;a.description=document.getElementById('ax').value;a.effects=document.getElementById('ae').value;a.hazards=document.getElementById('ah').value;a.response=document.getElementById('ar').value;a.notes=document.getElementById('an').value;log(`AWE UPDATED // ${a.designation}`);save();aweManager()}
function deleteAwe(id){if(!confirm('Delete AWE record?'))return;db.awes=db.awes.filter(a=>a.id!==id);save();aweManager()}
function dataManager(){auth(()=>openModal(`<h1>DATA MANAGEMENT</h1><div class="notice">IMPORT AND EXPORT ARE PROTECTED.</div><div class="spacer"></div><div class="row"><button class="btn" onclick="exportData()">EXPORT DATABASE</button><label class="btn">IMPORT DATABASE<input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div>`))}
function exportData(){const b=new Blob([JSON.stringify({format:'ECTO-OS-BACKUP',version:4,created:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ECTO-OS-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);log('DATABASE EXPORTED')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.format!=='ECTO-OS-BACKUP'||![3,4].includes(x.version)||!x.data)throw 0;if(x.version===3){x.data.version=4;x.data.spectres=x.data.spectres||structuredClone(defaults.spectres);x.data.awes=x.data.awes||[]}if(confirm('Replace local database with this backup?')){db=x.data;save();log('DATABASE IMPORTED');closeModal();shell()}}catch{alert('INVALID ECTO BACKUP')}};r.readAsText(file)}
function settings(){auth(()=>openModal(`<h1>SYSTEM SETTINGS</h1><h2>CRT THEME</h2><div class="themeGrid">${[['Yellow','#ffbd36'],['Green','#62df70'],['C64 Blue','#55a8ff'],['Phosphor Orange','#ff8a32']].map(t=>`<button class="btn" style="color:${t[1]}" onclick="theme('${t[1]}')">${t[0]}</button>`).join('')}</div>`))}
function theme(c){document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--fg',c);save()}
function historyView(){auth(()=>openModal(`<h1>SYSTEM HISTORY</h1><div class="list">${db.history.map(h=>`<div class="item">${esc(h)}</div>`).join('')||'<div class="notice">NO HISTORY.</div>'}</div>`))}
function placeholder(title){return `<h1>${title}</h1><div class="notice">SYSTEM MODULE // NOT YET INITIALISED</div>`}
function openModal(html){document.getElementById('modal').innerHTML=`<div class="modalBox">${html}<div class="spacer"></div><button class="btn" onclick="closeModal()">CLOSE</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
shell();
</script></body></html>
